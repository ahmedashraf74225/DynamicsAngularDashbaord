<div class="gauge-card">
  <div class="gauge-content">
    <div class="gauge-number" 
         [style.color]="percent >= 95 ? '#6bb68c' : (percent >= 90 ? '#f1d37e' : '#d32f2f')">
      {{ percent }}%
    </div>
    
    <div class="bar-container-large">
      <div class="bar-fill-large" 
           [style.width.%]="percent" 
           [style.background-color]="percent >= 95 ? '#6bb68c' : (percent >= 90 ? '#f1d37e' : '#d32f2f')">
      </div>
    </div>
    </div>
</div>
