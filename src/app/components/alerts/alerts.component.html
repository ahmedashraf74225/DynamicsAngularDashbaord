<div class="alerts-container">
  <div class="alert-list">
    
    <div *ngFor="let alert of alerts" 
         class="alert-item" 
         [ngClass]="alert.type">
      <span class="alert-message">{{ alert.message }}</span>
    </div>
    
    <div *ngIf="alerts.length === 0" class="no-alerts">
      <span>No active alerts.</span>
    </div>
  </div>
</div>
